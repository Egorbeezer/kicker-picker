name: Deploy to tgcloud

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tgcloud/**'
      - 'support-bot/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tgcloud.jsonc'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Prepare GitHub Pages artifact
        run: |
          rm -rf _pages
          cp -r dist _pages
          printf 'live.djbeezer.su\n' > _pages/CNAME
          cp _pages/index.html _pages/404.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

      - name: Deploy main bot & Mini App
        env:
          TGCLOUD_B64: ${{ secrets.TGCLOUD_B64 }}
        run: |
          if [ -z "$TGCLOUD_B64" ]; then
            echo "TGCLOUD_B64 secret is not set" >&2
            exit 1
          fi
          echo "$TGCLOUD_B64" | base64 -d | tar -xzf -
          chmod 600 .tgcloud/credentials
          npx tgcloud fetch || true
          npx tgcloud push
          npx tgcloud migrate --dry-run || true

      - name: Deploy support-bot
        env:
          SUPPORT_TGCLOUD_B64: ${{ secrets.SUPPORT_TGCLOUD_B64 }}
        run: |
          if [ -z "$SUPPORT_TGCLOUD_B64" ]; then
            echo "SUPPORT_TGCLOUD_B64 secret is not set, skipping support-bot deploy"
            exit 0
          fi
          mkdir -p /tmp/support-tgcloud
          echo "$SUPPORT_TGCLOUD_B64" | base64 -d | tar -xzf - -C /tmp/support-tgcloud
          if [ -d /tmp/support-tgcloud/support-bot/.tgcloud ]; then
            rm -rf support-bot/.tgcloud
            mv /tmp/support-tgcloud/support-bot/.tgcloud support-bot/.tgcloud
          elif [ -d /tmp/support-tgcloud/.tgcloud ]; then
            rm -rf support-bot/.tgcloud
            mv /tmp/support-tgcloud/.tgcloud support-bot/.tgcloud
          fi
          rm -rf /tmp/support-tgcloud
          if [ ! -f support-bot/.tgcloud/credentials ]; then
            echo "::warning::support-bot/.tgcloud/credentials not found in SUPPORT_TGCLOUD_B64, skipping support-bot deploy"
            exit 0
          fi
          chmod 600 support-bot/.tgcloud/credentials
          (cd support-bot && ../node_modules/.bin/tgcloud fetch || true)
          npm run deploy:support

  deploy-pages:
    needs: deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
